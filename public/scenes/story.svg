<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
<style>
.o{stroke:#2A2B2F;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.t{stroke:#2A2B2F;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.steam{fill:none;stroke:#FEF9EF;stroke-width:9;stroke-linecap:round;opacity:.5;transform-box:fill-box;transform-origin:50% 100%;animation:rise 6.5s ease-in-out infinite}
.s2{animation-delay:-2.2s}.s3{animation-delay:-4.3s}
@keyframes rise{0%{opacity:0;transform:translateY(30px) scaleY(.85)}25%{opacity:.6}70%{opacity:.35}100%{opacity:0;transform:translateY(-70px) scaleY(1.1)}}
.arm{transform-box:view-box;transform-origin:850px 486px;animation:stir 5s linear infinite}
@keyframes stir{0%{transform:rotate(0deg) translate(0,0)}25%{transform:rotate(2deg) translate(5px,-3px)}50%{transform:rotate(0deg) translate(0,-6px)}75%{transform:rotate(-2deg) translate(-5px,-3px)}100%{transform:rotate(0deg) translate(0,0)}}
.ripple{transform-box:fill-box;transform-origin:center;animation:rip 5s ease-in-out infinite}
@keyframes rip{0%,100%{transform:scale(.9);opacity:.5}50%{transform:scale(1.15);opacity:.9}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 4s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.8)}}
.glow{animation:breathe 7s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.8}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
