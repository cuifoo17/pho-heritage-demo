<radialGradient id="g" cx="50%" cy="50%" r="50%">
<stop offset="0" stop-color="#D9953B" stop-opacity=".42"/>
<stop offset=".55" stop-color="#A86A1F" stop-opacity=".14"/>
<stop offset="1" stop-color="#A86A1F" stop-opacity="0"/>
</radialGradient>
