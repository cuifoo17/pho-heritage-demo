<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
<style>
.o{stroke:#2A2B2F;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.t{stroke:#2A2B2F;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.steam{fill:none;stroke:#FEF9EF;stroke-width:9;stroke-linecap:round;opacity:.5;transform-box:fill-box;transform-origin:50% 100%;animation:rise 7s ease-in-out infinite}
.s2{animation-delay:-1.7s}.s3{animation-delay:-3.5s}.s4{animation-delay:-5.2s}
@keyframes rise{0%{opacity:0;transform:translateY(30px) scaleY(.85)}25%{opacity:.6}70%{opacity:.35}100%{opacity:0;transform:translateY(-70px) scaleY(1.1)}}
.glow{transform-box:fill-box;transform-origin:center;animation:breathe 8s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.85}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
