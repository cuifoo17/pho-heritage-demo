<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
<style>
.o{stroke:#2A2B2F;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.t{stroke:#2A2B2F;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.beam{transform-box:fill-box;transform-origin:50% 0%;animation:sway 8s ease-in-out infinite;opacity:.2}
.b2{animation-duration:7s;animation-delay:-2.5s}.b3{animation-duration:6s;animation-delay:-4s}.b4{animation-duration:7.5s;animation-delay:-1s}
@keyframes sway{0%,100%{transform:rotate(-6deg);opacity:.14}50%{transform:rotate(6deg);opacity:.26}}
.spot{opacity:.35;animation:pulse 6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.12}50%{opacity:.45}}
.glow{animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}
.ballspark{animation:pulse 4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
