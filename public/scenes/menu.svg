<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
<style>
.o{stroke:#2A2B2F;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.t{stroke:#2A2B2F;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.lglow{opacity:.4;animation:lg 7s ease-in-out infinite}
@keyframes lg{0%,100%{opacity:.28}50%{opacity:.5}}
.lcone{opacity:.08;animation:lc 7s ease-in-out infinite}
@keyframes lc{0%,100%{opacity:.05}50%{opacity:.12}}
.bulb{opacity:.9;animation:bl 7s ease-in-out infinite}
@keyframes bl{0%,100%{opacity:.75}50%{opacity:1}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sw 8s ease-in-out infinite}
@keyframes sw{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.flick{transform-box:fill-box;transform-origin:50% 100%;animation:fl 4s ease-in-out infinite}
@keyframes fl{0%,100%{transform:scale(1,1)}50%{transform:scale(.85,1.12)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
